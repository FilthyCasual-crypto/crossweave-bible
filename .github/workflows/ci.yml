name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Data integrity and ASCII rule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify.py

  render:
    name: Render every view
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm i -D playwright && npx playwright install --with-deps chromium
      - name: Serve the app
        run: |
          cd app && python3 -m http.server 8000 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/index.html >/dev/null && break
            sleep 1
          done
      - run: node scripts/check.mjs --shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: .shots/
          if-no-files-found: ignore
