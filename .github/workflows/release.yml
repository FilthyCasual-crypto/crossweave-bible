name: Release

# Push a tag like v1.0.0 and this builds the offline download and attaches it to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify before packaging
        run: python3 scripts/verify.py
      - name: Build the offline zip
        run: |
          name="crossweave-${GITHUB_REF_NAME}"
          mkdir -p "dist/$name"
          cp -r app "dist/$name/app"
          cp launch/start.sh launch/start.bat launch/README.txt LICENSE ATTRIBUTION.md "dist/$name/"
          chmod +x "dist/$name/start.sh"
          (cd dist && zip -qr "$name.zip" "$name")
          echo "ZIP=dist/$name.zip" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber \
            || gh release create "$GITHUB_REF_NAME" "$ZIP" --title "Crossweave $GITHUB_REF_NAME" --generate-notes
